# Optional: copy to .github/workflows/triage.yml to run /triage nightly.
# Needs a CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`) or ANTHROPIC_API_KEY secret.
name: Triage
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g @anthropic-ai/claude-code
      - name: Draft intents from new issues
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # only the tracker you use needs its secret
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          claude -p "/triage" \
            --allowedTools "Read,Grep,Glob,Write,Bash(python3 .claude/scripts/issue.py:*),Bash(gh issue list:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh pr create:*),Bash(git checkout:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(mkdir:*)" \
            --output-format json > triage-result.json
